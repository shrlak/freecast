# Builds the macOS (.dmg/.zip) and Windows (.exe) installers in the cloud and publishes them to the
# GitHub Release for the version in package.json. Installed copies of FreeCast check these releases
# and update themselves.
#
# Run it by hand (Actions → Release → Run workflow). It does NOT run on tag pushes any more: a release
# published from locally tested builds must not be overwritten by a second, untested cloud build.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A manual run is on a branch, not a tag, and GitHub refuses a release without one
  # ("Published releases must have a valid tag"): make v<version> first, if it is not there yet.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the version tag
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null 2>&1; then
            echo "$v already exists"
          else
            git tag "$v"
            git push origin "$v"
          fi

  build:
    needs: tag
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package and publish
        run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
