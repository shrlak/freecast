<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:" />
<title>KCCP FreeCast</title>
<link rel="stylesheet" href="../dist/splash.css" />
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .fc-splash { border: 1px solid #d9dee6; border-radius: 14px; }
</style>
</head>
<body>
    <div class="fc-splash" title="클릭하면 건너뜁니다">
      <div class="fc-main">
        <div class="fc-stage">
          <svg class="fc-emblem" viewBox="0 0 407 356" aria-hidden="true">
            <defs><clipPath id="fc-clip"><rect x="0" y="73" width="295" height="283" /><polygon points="313,70 407,0 407,233 313,350" /></clipPath></defs>
            <rect class="g" x="0" y="73" width="295" height="283" fill="#4bc789" />
            <polygon class="y" points="313,70 407,0 407,233 313,350" fill="#fde718" />
            <rect class="c" x="249" y="129" width="112" height="15" fill="#ffffff" />
            <g clip-path="url(#fc-clip)"><g transform="skewX(-20)"><rect class="shine" x="-60" y="-40" width="60" height="460" fill="rgba(255,255,255,.55)" /></g></g>
          </svg>
          <div class="fc-word"><img src="../dist/church-logo-text.png" alt="Korean Central Church of Pittsburgh · 빛주사랑 대학청년부" /></div>
        </div>
        <div class="fc-bar"></div>
        <div class="fc-name">KCCP 예배 프레젠테이션 · FreeCast</div>
      </div>
      <footer class="fc-team"><img src="../dist/media-team-logo.png" alt="KCCP Media Team" /><span>KCCP 빛주사랑 대학청년부 미디어팀</span></footer>
    </div>
    <script src="../dist/splash.js"></script>
</body>
</html>
